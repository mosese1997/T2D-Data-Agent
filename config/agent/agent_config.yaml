agent:
  runtime: toolloop
  model: t2d/deepseek-v4.1-flash-1017
  temperature: 0.2
  max_tokens: 4096
  main_agent:
    prompt_version: '1'
    max_steps: 40
    max_tool_calls: 30
    max_tokens_per_task: 500000
  query_agent:
    prompt_version: '1'
    max_steps: 24
    max_tool_calls: 16
    max_sql_repairs: 2
  analysis_agent:
    prompt_version: '1'
    max_steps: 24
    max_tool_calls: 16
    sandbox_timeout_s: 120
  swarmflow:
    openjiuwen_home: var/openjiuwen
    enable_sys_operation: false
    enable_read_image_multimodal: false
    default_cap: 4
