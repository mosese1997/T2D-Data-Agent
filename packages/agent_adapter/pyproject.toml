[project]
name = "agent-adapter"
version = "0.1.0"
description = "t2d agent runtime abstraction: toolloop baseline + SwarmFlow adapter"
requires-python = ">=3.12"
dependencies = [
  "openai>=1.60,<3",
  "pydantic>=2.10,<3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent_adapter*"]
