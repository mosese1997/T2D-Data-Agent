[project]
name = "dashboard-schema"
version = "0.1.0"
description = "t2d dashboard canvas JSON schema, patches, diff, validation"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10,<3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dashboard_schema*"]
