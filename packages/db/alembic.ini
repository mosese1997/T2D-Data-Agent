# Alembic config for the t2d state DB. The URL is injected from the
# environment in alembic/env.py (STATE_DB_URL / MYSQL_URL); this placeholder
# keeps the CLI happy.
[alembic]
script_location = t2d_db/alembic
prepend_sys_path = .
sqlalchemy.url = sqlite:///var/state.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
