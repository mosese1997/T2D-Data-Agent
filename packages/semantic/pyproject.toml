[project]
name = "semantic"
version = "0.1.0"
description = "t2d semantic layer: metrics, terms, join rules, caliber rules, retrieval"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10,<3",
  "pyyaml>=6,<7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["semantic*"]
