[project]
name = "query-gateway"
version = "0.1.0"
description = "t2d query gateway: validation, repair, limits, audit"
requires-python = ">=3.12"
dependencies = [
  "sqlglot>=26,<28",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["query_gateway*"]
