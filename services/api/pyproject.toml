[project]
name = "t2d-api"
version = "0.1.0"
description = "t2d FastAPI service: auth, REST, SSE"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "itsdangerous>=2.2,<3",
  "t2d-db",
  "agent-adapter",
  "cloud-adapters",
  "semantic",
  "query-gateway",
  "dashboard-schema",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["t2d_api*"]
