# t2d Nginx — 唯一公网入口（HTTP 演示环境，任务书 §6）
# SSE 专用 location：关闭代理缓冲，长超时，心跳由后端 15s 注释行维持。

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    # 基础限速（演示环境防误压）
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    # Docker 内置 DNS：配合下方变量式 proxy_pass，每次请求重新解析 api 主机名，
    # 容器重建换 IP 后自动跟随（不再需要 restart nginx）。
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        # 8080 = 原生入口；443 = 自签 HTTPS（浏览器强制升级 https 时的可点击继续路径）
        listen 8080;
        listen 443 ssl;
        ssl_certificate     /etc/nginx/certs/t2d.crt;
        ssl_certificate_key /etc/nginx/certs/t2d.key;
        server_name _;

        # 静态前端
        location / {
            root   /usr/share/nginx/html;
            index  index.html;
            try_files $uri $uri/ /index.html;   # SPA 路由回退
        }

        # SSE：必须关闭缓冲（任务书 §6）
        location ~ ^/api/tasks/[0-9]+/events$ {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://api:8001;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            add_header X-Accel-Buffering no;
        }

        # API
        location /api/ {
            limit_req zone=api burst=60 nodelay;
            proxy_pass http://api:8001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
            client_max_body_size 10m;
        }
    }
}
