# t2d 全栈（演示模式）。端口约定见 CLAUDE.md；避开宿主机已占用端口。
# 阶段 6 拓扑（单机演示形态）：nginx(8080) → api(8001) + worker(8002)
# + business-pg(5434, 模拟 DWS) + sandbox-server(8003)。
# 两台 ECS 生产形态见 docs/deployment.md（ECS-B 跑业务库与状态库）。
name: t2d

services:
  business-pg:
    image: postgres:16-alpine
    container_name: t2d_business_pg
    environment:
      POSTGRES_DB: t2d_biz
      POSTGRES_USER: t2d
      POSTGRES_PASSWORD: t2d-demo-only
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - t2d_biz_pgdata:/var/lib/postgresql/data
      - ../../scripts/schema_business.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U t2d -d t2d_biz"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    container_name: t2d_api
    depends_on:
      business-pg:
        condition: service_healthy
    environment:
      APP_ENV: prod
      APP_BRAND: t2d
      APP_SECRET_KEY: ${APP_SECRET_KEY:-change-me-generate-a-random-string}
      STATE_DB_URL: sqlite:////var/lib/t2d/state.db
      DEMO_PG_HOST: business-pg
      DEMO_PG_PORT: "5432"
      MODEL_API_BASE: ${MODEL_API_BASE:-http://host.docker.internal:4000/v1}
      MODEL_API_KEY: ${MODEL_API_KEY:-change-me}
      MODEL_NAME: t2d/deepseek-v4.1-flash-1017
      SANDBOX_SERVER: http://host.docker.internal:8003
      SANDBOX_API_KEY: ${SANDBOX_API_KEY:-change-me-in-.env-sandbox-api-key}
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - t2d_appdata:/var/lib/t2d
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  worker:
    build:
      context: ../..
      dockerfile: services/worker/Dockerfile
    container_name: t2d_worker
    depends_on:
      business-pg:
        condition: service_healthy
      sandbox-server:
        condition: service_started
    environment:
      APP_ENV: prod
      STATE_DB_URL: sqlite:////var/lib/t2d/state.db
      DEMO_PG_HOST: business-pg
      DEMO_PG_PORT: "5432"
      MODEL_API_BASE: ${MODEL_API_BASE:-http://host.docker.internal:4000/v1}
      MODEL_API_KEY: ${MODEL_API_KEY:-change-me}
      MODEL_NAME: t2d/deepseek-v4.1-flash-1017
      SANDBOX_SERVER: http://host.docker.internal:8003
      SANDBOX_API_KEY: ${SANDBOX_API_KEY:-change-me-in-.env-sandbox-api-key}
      TASK_ANALYSIS_CONCURRENCY: "2"
      SANDBOX_TIMEOUT_S: "120"
    ports:
      - "127.0.0.1:8002:8002"
    volumes:
      - t2d_appdata:/var/lib/t2d
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  sandbox-server:
    build:
      context: ../..
      dockerfile: infra/sandbox/Dockerfile
    container_name: t2d_sandbox_server
    # The server creates sandbox containers via the host docker socket and
    # health-checks them on their docker0 IPs — host networking makes it
    # host-like (the probe-verified form); bridge networking left the
    # health check waiting 30s across incompatible docker networks.
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  nginx:
    build:
      context: ../..
      dockerfile: infra/nginx/Dockerfile
      args:
        PUBLIC_IP: ${PUBLIC_IP:-203.0.113.10}
    container_name: t2d_nginx
    depends_on:
      - api
    ports:
      - "8080:8080"   # 原生入口（HTTP 演示环境）
      - "80:8080"     # 裸 IP 直达（浏览器对无端口 IP 不做激进 https 升级）
      - "8443:443"    # 自签 HTTPS（443 被宿主 sshd 备用通道占用，改用 8443）
    restart: unless-stopped

  # ── E2: OpenMetadata (元数据中心) ──
  # 精简部署：MySQL + ES + server（无 ingestion 镜像；摄取走 REST API 脚本）
  openmetadata-mysql:
    container_name: openmetadata_mysql
    image: docker.getcollate.io/openmetadata/db:2.0.7
    command: "--sort_buffer_size=10M"
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${OM_MYSQL_ROOT_PASSWORD:-password}
    expose:
      - "3306"
    volumes:
      - t2d_om_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysql", "--user=root", "--password=$$MYSQL_ROOT_PASSWORD", "--silent", "--execute", "use openmetadata_db"]
      interval: 15s
      timeout: 10s
      retries: 10

  openmetadata-es:
    container_name: openmetadata_elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.0
    restart: always
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms1024m -Xmx1024m
      - xpack.security.enabled=false
    expose:
      - "9200"
    volumes:
      - t2d_om_es:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE 'green|yellow' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  openmetadata-server:
    container_name: openmetadata_server
    image: docker.getcollate.io/openmetadata/server:2.0.7
    restart: always
    depends_on:
      openmetadata-mysql:
        condition: service_healthy
      openmetadata-es:
        condition: service_healthy
    environment:
      OPENMETADATA_CLUSTER_NAME: openmetadata
      SERVER_PORT: "8585"
      SERVER_ADMIN_PORT: "8586"
      LOG_LEVEL: INFO
      DB_DRIVER_CLASS: com.mysql.cj.jdbc.Driver
      DB_SCHEME: mysql
      DB_USER: openmetadata_user
      DB_USER_PASSWORD: ${OM_DB_PASSWORD:-openmetadata_password}
      DB_HOST: openmetadata-mysql
      DB_PORT: "3306"
      DB_SCHEMA: openmetadata_db
      ES_HOST: openmetadata-es
      ES_PORT: "9200"
      AUTHORIZER_CLASS_NAME: org.openmetadata.service.security.DefaultAuthorizer
      AUTHORIZER_REQUEST_FILTER: org.openmetadata.service.security.JwtFilter
      AUTHORIZER_ADMIN_PRINCIPALS: "[admin]"
      AUTHORIZER_ALLOWED_REGISTRATION_DOMAIN: '["all"]'
      AUTHORIZER_PRINCIPAL_DOMAIN: '"open-metadata.org"'
      AUTHORIZER_ENFORCE_PRINCIPAL_DOMAIN: "false"
      AUTHENTICATION_PROVIDER: basic
      AUTHENTICATION_RESPONSE_TYPE: id_token
      AUTHENTICATION_PUBLIC_KEYS: '[http://localhost:8585/api/v1/system/config/jwks]'
      AUTHENTICATION_AUTHORITY: https://accounts.google.com
      AUTHENTICATION_JWT_PRINCIPAL_CLAIMS: '[email,preferred_username,sub]'
      AUTHENTICATION_ENABLE_SELF_SIGNUP: "true"
      AUTHENTICATION_CLIENT_TYPE: public
    ports:
      - "8585:8585"
      - "8586:8586"


volumes:
  t2d_biz_pgdata:
  t2d_om_mysql:
  t2d_om_es:
  t2d_appdata:
